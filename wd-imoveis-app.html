<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>W&amp;D Imóveis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#070707;--sf:#111;--bd:#2A2417;--gd:#D4AF37;--gl:#F0D78C;--tx:#F5F1E6;--mu:#A9A296;--gr:linear-gradient(135deg,#F0D78C,#D4AF37 50%,#A8802B)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding:0 20px 110px;overflow:hidden}
#app::before{content:"";position:absolute;top:-160px;left:50%;width:560px;height:380px;margin-left:-280px;background:radial-gradient(closest-side,rgba(212,175,55,.16),transparent);pointer-events:none}
.serif{font-family:'Cormorant Garamond',serif}
.gold{background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
.mu{color:var(--mu)}.sm{font-size:13px}
.row{display:flex;align-items:center}.sb{justify-content:space-between}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}.ic.s{width:18px;height:18px}
.hd{gap:12px;padding-top:24px;position:relative}
.lg{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 1.5px var(--gd),0 0 18px rgba(212,175,55,.35)}
.t1{font-size:26px;font-weight:700;line-height:1}
h1,h2{font-family:'Cormorant Garamond',serif;margin:0;font-weight:600;position:relative}
h1{font-size:36px;line-height:1.05;margin-top:26px}h2{font-size:26px;font-weight:700}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;position:relative}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border:0;border-radius:16px;background:var(--gr);color:#0B0B0B;font:600 14px 'Inter',sans-serif;text-decoration:none;cursor:pointer}
.btn.o{background:none;color:var(--gl);border:1px solid #4A3D1A}
.sbar{display:flex;gap:10px;margin-top:20px;position:relative}
.sbar label{flex:1;display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border-radius:16px;background:var(--sf);border:1px solid #4A3D1A;color:var(--gd)}
input[type=text],select{background:none;border:0;outline:0;color:var(--tx);font:15px 'Inter',sans-serif;flex:1;min-width:0}
select{flex:none;background:var(--sf);border:1px solid var(--bd);border-radius:12px;height:44px;padding:0 10px;font-size:13px}
.ib{width:56px;height:56px;border-radius:16px;border:0;background:var(--gr);color:#0B0B0B;display:flex;align-items:center;justify-content:center;cursor:pointer}
.qs{display:flex;justify-content:space-around;margin-top:26px;position:relative}
.q{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--tx);font:500 12px 'Inter',sans-serif;cursor:pointer;min-width:44px}
.q span{width:64px;height:64px;border-radius:20px;background:var(--sf);border:1px solid #3A3018;display:flex;align-items:center;justify-content:center;color:var(--gd)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px -20px 0;padding:0 20px}
.chip{height:44px;padding:0 16px;border-radius:999px;border:1px solid #3A3018;background:var(--sf);color:var(--tx);font:13px 'Inter',sans-serif;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--gr);color:#0B0B0B;border:0;font-weight:600}
.sim{padding:20px;margin-top:30px;background:linear-gradient(160deg,#17130A,#0D0D0D 60%);border-color:#4A3D1A}
.f{margin-top:14px}.f b{color:var(--gl);font-weight:600;font-size:13px}
input[type=range]{width:100%;height:32px;margin:0;accent-color:var(--gd)}
.res{margin-top:18px;padding-top:16px;border-top:1px solid var(--bd)}
.big{font-size:40px;font-weight:700;line-height:1.1}
.r{display:flex;justify-content:space-between;font-size:14px;padding:11px 0;border-top:1px solid var(--bd)}.r b{font-weight:600}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);margin-top:16px}
.seg button{flex:1;height:44px;border:0;border-radius:10px;background:none;color:var(--mu);font:500 14px 'Inter',sans-serif;cursor:pointer}
.seg .on{background:var(--gr);color:#0B0B0B;font-weight:600}
.list{display:flex;flex-direction:column;gap:18px;margin-top:12px}
.cb{display:block;width:100%;padding:0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;overflow:hidden;border-radius:20px}
.im{height:172px;width:100%;object-fit:cover;display:block}
.bd{padding:16px}
.price{font-size:24px;font-weight:700;white-space:nowrap}
.sp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.badge{position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:600;color:#0B0B0B;background:var(--gr)}
.fav{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(7,7,7,.72);color:var(--gl);display:flex;align-items:center;justify-content:center;cursor:pointer}
.fav.on svg{fill:var(--gd);stroke:var(--gd)}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:#0B0B0B;border-top:1px solid var(--bd);z-index:10}
.nb{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;min-height:44px;background:none;border:0;color:#8A8478;font:11px 'Inter',sans-serif;cursor:pointer}.nb.on{color:var(--gd)}
.ov{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--bg);overflow:auto;z-index:20;padding-bottom:110px}
.ov .im{height:300px}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;gap:10px;padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));background:#0B0B0B;border-top:1px solid var(--bd)}.bar .btn{flex:1}
.back{position:absolute;top:20px;left:20px;width:44px;height:44px;border-radius:50%;border:1px solid #3A3018;background:rgba(7,7,7,.72);color:var(--gl);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tiles{display:flex;padding:4px 6px}.tiles div{flex:1;padding:14px 4px;text-align:center;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:6px}.tiles b{font-size:16px;color:var(--tx);font-weight:600}.tiles svg{color:var(--gd)}
.note{font-size:12px;line-height:1.5;color:var(--mu);margin:14px 0 0}
.empty{padding:40px 20px;text-align:center;color:var(--mu);font-size:14px}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:#25D366;color:#0B0B0B;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.55);z-index:15}
.fab .ic{width:28px;height:28px}
input.in{width:100%;height:52px;margin-top:8px;padding:0 16px;border-radius:14px;background:#0B0B0B;border:1px solid #4A3D1A;color:var(--tx);font:15px 'Inter',sans-serif;outline:0;flex:none}
input.in:focus{border-color:var(--gd);box-shadow:0 0 0 2px rgba(212,175,55,.3)}
input.in::placeholder{color:#8A8478}
</style>
</head>

${full?`<p class="note">Simulação estimada, com taxa de exemplo, sujeita à análise de crédito e às condições da instituição financeira. Fale com a W&amp;D sobre financiamento popular e uso do FGTS.</p><a class="btn" data-wa href="#" target="_blank" rel="noopener" style="margin-top:16px">${ic('chat','s')}Falar com um corretor</a>`:''}`}

const fab=()=>`<a class="fab" href="${wa('Olá! Vim pelo app da W&D Imóveis e gostaria de atendimento.')}" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">${ic('wa')}</a>`;
const lead=()=>`<section class="card" style="margin-top:30px;padding:20px;border-color:#4A3D1A"><h2 style="font-size:22px">Deixe seu contato</h2><p class="mu sm" style="margin:6px 0 0">Informe seu nome e telefone e a W&amp;D entra em contato com você.</p><div class="f" style="margin-top:16px"><label for="ln" class="mu sm">Seu nome</label><input class="in" id="ln" type="text" data-k="ln" autocomplete="name" placeholder="Nome completo"></div><div class="f"><label for="lt" class="mu sm">Telefone com DDD</label><input class="in" id="lt" type="tel" data-k="lt" inputmode="tel" autocomplete="tel" placeholder="(61) 90000-0000"></div><button class="btn" data-a="lead" style="width:100%;margin-top:18px">Quero ser atendido(a)</button><p id="lm" role="status" class="sm" style="margin:12px 0 0;min-height:18px"></p><p class="note" style="margin-top:6px">Ao enviar, você autoriza a W&amp;D Imóveis a entrar em contato por WhatsApp ou telefone. Seus dados são usados apenas para esse atendimento.</p></section>`;
function sendLead(){const n=document.getElementById('ln').value.trim(),f=document.getElementById('lt').value,t=f.replace(/\D/g,''),m=document.getElementById('lm');
if(n.length<2||t.length<10){m.style.color='#E8A8A0';m.textContent='Informe seu nome e um telefone com DDD.';return}
m.style.color='var(--gl)';m.textContent='Pronto! Abrimos o WhatsApp para você enviar seus dados à W&D.';
window.open(wa(`Olá! Meu nome é ${n} e meu telefone é ${f}. Gostaria que a W&D entrasse em contato comigo.`),'_blank','noopener')}
const head=()=>`<header class="row hd"><img class="lg" src="${LOGO}" alt="Logo W&amp;D Imóveis"><div><div class="mu sm">Valparaíso de Goiás, GO</div><div class="serif gold t1">W&amp;D Imóveis</div></div></header>`;
const specs=i=>[i.q?`${ic('bed','s')}${i.q} quartos`:'',i.b?`${ic('bath','s')}${i.b} banh.`:'',i.v?`${ic('car','s')}${i.v} vagas`:'',i.m?`${ic('area','s')}${i.m} m²`:'',...(i.ex||[]).map(([k,v])=>`${k}: ${v}`)].filter(Boolean).map(x=>`<span class="sp">${x}</span>`).join('');
const pv=i=>i.preco?brl(i.preco):'Consulte o valor';
const card=i=>`<article class="card"><button class="cb" data-a="det" data-id="${i.id}"><img class="im" src="${IMG[i.img]}" alt="${i.tit}">${i.dest?'<span class="badge">Destaque</span>':''}<div class="bd"><div class="row sb" style="align-items:flex-start;gap:12px"><div><div style="font-weight:600;font-size:16px">${i.tit}</div><div class="sp" style="margin-top:4px">${ic('pin','s')}${i.loc}</div></div><div style="text-align:right">${i.rot?`<div class="mu sm">${i.rot}</div>`:''}<div class="serif gold price"${i.preco?'':' style="font-size:16px"'}>${pv(i)}</div></div></div>${specs(i)?`<div class="row" style="gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)">${specs(i)}</div>`:''}</div></button><button class="fav ${S.fav.includes(i.id)?'on':''}" data-a="fav" data-id="${i.id}" aria-label="Favoritar" aria-pressed="${S.fav.includes(i.id)}">${ic('heart','s')}</button></article>`;
function filtered(){let r=IM.filter(i=>(S.tipo==='Todos'||i.tipo===S.tipo)&&norm(i.tipo+' '+i.tit+' '+i.loc).includes(norm(S.q)));
if(S.ord==='min')r.sort((a,b)=>(a.preco||1e12)-(b.preco||1e12));if(S.ord==='max')r.sort((a,b)=>(b.preco||0)-(a.preco||0));return r}
const listHTML=()=>{const r=filtered();return `<div class="mu sm" style="margin-top:16px">${r.length} ${r.length===1?'imóvel encontrado':'imóveis encontrados'}</div><div class="list">${r.map(card).join('')||'<div class="empty">Nenhum imóvel encontrado. Tente outro filtro.</div>'}</div>`};

function view(){
if(S.v==='inicio')return `${head()}<h1>Encontre o imóvel <span class="gold">dos seus sonhos</span></h1>
<div class="sbar"><label><span aria-hidden="true">${ic('search','s')}</span><input type="text" data-k="hq" placeholder="Buscar em Valparaíso de Goiás e região" aria-label="Buscar imóveis em Valparaíso de Goiás"></label><button class="ib" data-a="hs" aria-label="Buscar">${ic('search')}</button></div>
<div class="qs">${TIPOS.map(t=>`<button class="q" data-a="tipo" data-v="${t}"><span>${ic(TI[t])}</span>${t}s</button>`).join('')}</div>
${sim(false)}
<div class="row sb" style="margin-top:30px"><h2>Imóveis em destaque</h2><button class="chip" style="border:0;background:none;color:var(--gd)" data-a="nav" data-v="buscar">Ver todos</button></div>
<div class="list">${IM.filter(i=>i.dest).map(card).join('')}</div><section class="card" style="margin-top:26px;padding:18px;border-color:#4A3D1A"><div class="serif gold" style="font-size:22px;font-weight:700;line-height:1.15">Especialista em financiamento popular e uso do FGTS</div><p class="mu sm" style="margin:6px 0 14px">Transforme o sonho da casa própria em realidade com parcelas acessíveis!</p><button class="btn" data-a="nav" data-v="sobre" style="width:100%">Conheça a W&amp;D</button></section>${lead()}<p class="note">Imóveis divulgados pela W&amp;D no Instagram. Valores e disponibilidade sujeitos a alteração. Ágio é o valor pago ao vendedor para assumir o financiamento em andamento.</p>`;
if(S.v==='buscar')return `${head()}<div class="sbar"><label><span aria-hidden="true">${ic('search','s')}</span><input type="text" data-k="q" value="${S.q}" placeholder="Bairro ou tipo de imóvel" aria-label="Buscar imóveis"></label><select data-k="ord" aria-label="Ordenar"><option value="rel">Relevância</option><option value="min"${S.ord==='min'?' selected':''}>Menor preço</option><option value="max"${S.ord==='max'?' selected':''}>Maior preço</option></select></div>
<div class="chips">${['Todos',...TIPOS].map(t=>`<button class="chip ${S.tipo===t?'on':''}" data-a="tf" data-v="${t}">${t}</button>`).join('')}</div><div id="list">${listHTML()}</div>`;
if(S.v==='simulador')return `${head()}<h1 style="font-size:32px">Simule seu <span class="gold">financiamento</span></h1>${sim(true)}`;
if(S.v==='sobre')return sobre();
const f=IM.filter(i=>S.fav.includes(i.id));
return `${head()}<h1 style="font-size:32px">Seus <span class="gold">favoritos</span></h1><div class="list">${f.map(card).join('')||'<div class="empty">Você ainda não favoritou imóveis. Toque no coração de um imóvel para salvá-lo aqui.</div>'}</div>`}

function sobre(){return `${head()}<h1 style="font-size:32px">Conquiste o seu <span class="gold">lar</span></h1>
<section class="card" style="margin-top:22px;padding:22px;border-color:#4A3D1A;background:linear-gradient(160deg,#17130A,#0D0D0D 60%);text-align:center"><img class="lg" style="width:96px;height:96px;margin:0 auto;display:block" src="${LOGO}" alt="Logo W&amp;D Imóveis"><h2 style="margin-top:14px">W&amp;D Corretora Autorizada</h2><p class="mu" style="font-size:14px;line-height:1.55;margin:8px 0 0">Transforme o sonho da casa própria em realidade com parcelas acessíveis!</p></section>
<div class="card" style="margin-top:16px;padding:0 18px">${[['home','Casa própria com parcelas acessíveis'],['calc','Especialista em financiamento popular'],['check','Especialista no uso do FGTS']].map(([i,t],k)=>`<div class="row" style="gap:14px;padding:16px 0;${k?'border-top:1px solid var(--bd)':''}"><span style="color:var(--gd)">${ic(i)}</span><span style="font-size:14px">${t}</span></div>`).join('')}</div>
<div style="display:flex;flex-direction:column;gap:10px;margin-top:20px"><a class="btn" target="_blank" rel="noopener" href="${wa('Olá! Vim pelo app da W&D Imóveis e gostaria de atendimento.')}">${ic('chat','s')}Falar no WhatsApp</a><a class="btn o" target="_blank" rel="noopener" href="https://www.instagram.com/wdimoveis2022/">${ic('insta','s')}@wdimoveis2022</a></div>${lead()}<p class="note">Atendimento em Valparaíso de Goiás, GO.</p>`}
function detail(){const i=IM.find(x=>x.id===S.det),m=`Olá! Tenho interesse no anúncio: ${i.tit} (${i.loc})${i.preco?', '+pv(i):''}.`;
return `<div class="ov" role="dialog" aria-label="Detalhes do imóvel"><div style="position:relative"><img class="im" src="${IMG[i.img]}" alt="${i.tit}"><button class="back" data-a="close" aria-label="Voltar">${ic('back')}</button><button class="fav ${S.fav.includes(i.id)?'on':''}" style="top:20px;right:20px" data-a="fav" data-id="${i.id}" aria-label="Favoritar" aria-pressed="${S.fav.includes(i.id)}">${ic('heart','s')}</button></div>
<div style="padding:22px 20px 0"><h1 style="font-size:30px;margin:0">${i.tit}</h1><div class="sp" style="margin-top:8px">${ic('pin','s')}${i.loc}</div>${i.rot?`<div class="mu sm" style="margin-top:14px">${i.rot}</div>`:''}<div class="serif gold" style="font-size:${i.preco?38:24}px;font-weight:700;margin-top:${i.rot?2:14}px;line-height:1">${pv(i)}</div>
<div class="card tiles" style="margin-top:20px${(i.q||i.b||i.v||i.m)?'':';display:none'}">${i.q?`<div>${ic('bed')}<b>${i.q}</b>Quartos</div>`:''}${i.b?`<div>${ic('bath')}<b>${i.b}</b>Banheiros</div>`:''}${i.v?`<div>${ic('car')}<b>${i.v}</b>Vagas</div>`:''}${i.m?`<div>${ic('area')}<b>${i.m}</b>m²</div>`:''}</div>${(i.ex||[]).length?`<div class="card" style="margin-top:16px;padding:0 18px">${i.ex.map(([k,v],n)=>`<div class="r" style="${n?'':'border-top:0'}"><span class="mu">${k}</span><b>${v}</b></div>`).join('')}</div>`:''}
<h2 style="margin-top:24px;font-size:24px">Sobre o imóvel</h2><p class="mu" style="font-size:14px;line-height:1.55;margin:8px 0 0">${i.desc}</p>
<div class="card row" style="margin-top:22px;padding:14px;gap:12px;border-color:#4A3D1A"><img class="lg" style="width:52px;height:52px" src="${LOGO}" alt=""><div><div style="font-weight:600">W&amp;D Corretora Autorizada</div><div class="mu sm">Financiamento popular e uso do FGTS</div></div></div></div>
<div class="bar"><a class="btn o" target="_blank" rel="noopener" href="${wa(m+' Gostaria de agendar uma visita.')}">${ic('cal','s')}Agendar visita</a><a class="btn" target="_blank" rel="noopener" href="${wa(m)}">${ic('chat','s')}WhatsApp</a></div></div>`}

const NAV=[['inicio','Início','home'],['buscar','Buscar','search'],['simulador','Simulador','calc'],['favoritos','Favoritos','heart'],['sobre','Sobre','user']];
function render(){$app.innerHTML=view()+`<nav class="nav" aria-label="Navegação principal">${NAV.map(([k,l,i])=>`<button class="nb ${S.v===k?'on':''}" data-a="nav" data-v="${k}" ${S.v===k?'aria-current="page"':''}>${ic(i)}${l}</button>`).join('')}</nav>`+(S.det?detail():fab());upd()}
const $app=document.getElementById('app');
function nav(v){S.v=v;S.det=null;if(location.hash!=='#'+v)location.hash=v;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v,id=+t.dataset.id;
if(a==='nav')nav(v);
else if(a==='tipo'){S.tipo=v;S.q='';nav('buscar')}
else if(a==='tf'){S.tipo=v;render()}
else if(a==='hs'){S.q=document.querySelector('[data-k=hq]').value;S.tipo='Todos';nav('buscar')}
else if(a==='fav'){S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):[...S.fav,id];save();const y=window.scrollY,o=document.querySelector('.ov');const oy=o?o.scrollTop:0;render();window.scrollTo(0,y);const n=document.querySelector('.ov');if(n)n.scrollTop=oy}
else if(a==='det'){S.det=id;render()}
else if(a==='close'){S.det=null;render()}
else if(a==='sis'){S.sim.sis=v;render()}
else if(a==='lead')sendLead()});
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;
if(k==='q'){S.q=e.target.value;document.getElementById('list').innerHTML=listHTML()}
else if(k==='ord'){S.ord=e.target.value;document.getElementById('list').innerHTML=listHTML()}
else if(k==='lt'){const d=e.target.value.replace(/\D/g,'').slice(0,11),c=d.length>10?7:6;e.target.value=d.length>6?`(${d.slice(0,2)}) ${d.slice(2,c)}-${d.slice(c)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d}
else if(k in S.sim){S.sim[k]=+e.target.value;upd()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.k==='hq'){S.q=e.target.value;S.tipo='Todos';nav('buscar')}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.includes(h)&&h!==S.v){S.v=h;S.det=null;render()}});
const h0=location.hash.slice(1);if(VIEWS.includes(h0))S.v=h0;
render();
</script>
</body>
</html>
